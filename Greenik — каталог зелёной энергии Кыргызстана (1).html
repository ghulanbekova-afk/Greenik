<section class="sec"><div class="card" style="background:var(--soft)"><h2>Что можно улучшить при бюджете 10 000 сомов?</h2><p class="mu">Запусти демонстрацию: Greenik подберёт доступные решения для квартиры в Бишкеке.</p><button class="btn" data-a="demo">Запустить демонстрацию</button></div></section>
<section class="sec"><h2>Популярные решения</h2><div class="grid">${[1,3,7,10].map(id=>card(D.find(x=>x.id===id),{})).join("")}</div></section>
<section class="sec"><h2>Почему Greenik</h2><div class="grid g4">${[["Подбор по бюджету","Не предлагаем станцию за 400 000 тем, у кого 10 000."],["Прозрачные расчёты","Показываем диапазон и откуда взяты числа."],["Честно об ограничениях","У каждого решения указаны минусы и условия."],["Условия Кыргызстана","Холодные зимы, регионы, квартиры и частные дома."]].map(([t,d])=>`<div class="card"><h3>${t}</h3><p class="mu sm">${d}</p></div>`).join("")}</div></section>
<section class="sec"><div class="card" style="text-align:center;padding:36px"><h2>Решения, которые подходят именно тебе</h2><button class="btn" data-r="greenik">Подобрать решение</button></div></section>`}
function filtered(){const f=S.f,s=f.s.trim().toLowerCase();let r=D.filter(i=>(!s||(i.n+i.d+GOALS[i.g[0]]).toLowerCase().includes(s))&&(f.c===""||i.c==f.c)&&(!f.h||i.t.includes(f.h))&&(!f.g||i.g.includes(f.g))&&(!f.max||cost(i)<=+f.max));
const mid=i=>{const m=monthly(i,{});return m?(m.lo+m.hi)/2:0};
r.sort((a,b)=>f.sort=="p"?cost(a)-cost(b):f.sort=="s"?mid(b)-mid(a):(cost(a)/(mid(a)||1e-9))-(cost(b)/(mid(b)||1e-9)));return r}
const opts=(o,v,ph)=>`<option value="">${ph}</option>`+Object.entries(o).map(([k,t])=>`<option value="${k}" ${v==k?"selected":""}>${t}</option>`).join("");
function catalog(){const f=S.f;return`<section class="sec"><h2>Каталог</h2><p class="mu">Цены и экономия — демонстрационные, ориентировочные.</p><div class="filters"><input id="fs" placeholder="Поиск по названию и назначению" value="${f.s}"><select data-f="c">${opts(Object.fromEntries(CATS.map((c,i)=>[i,c])),f.c,"Все категории")}</select><select data-f="h">${opts(HOUS,f.h,"Любое жильё")}</select><select data-f="g">${opts(GOALS,f.g,"Любая цель")}</select><input data-f="max" type="number" min="0" placeholder="Бюджет до, сомов" value="${f.max}"><select data-f="sort"><option value="p" ${f.sort=="p"?"selected":""}>По стоимости</option><option value="s" ${f.sort=="s"?"selected":""}>По экономии</option><option value="r" ${f.sort=="r"?"selected":""}>По окупаемости</option></select></div><div id="cl"></div></section>`}
function catList(){const r=filtered();$("#cl").innerHTML=r.length?`<div class="grid">${r.map(i=>card(i,{})).join("")}</div>`:`<div class="card" style="text-align:center"><h3>Ничего не найдено</h3><p class="mu">Измените запрос или увеличьте бюджет.</p><button class="btn s" data-a="reset">Сбросить фильтры</button></div>`}
const QS=["Где ты живёшь?","В каком регионе?","Что хочешь улучшить?","Какой у тебя бюджет?","Какие источники энергии доступны?","Дополнительная информация"];
const BUD=[["До 5 000 сомов",5000],["5 000–20 000 сомов",20000],["20 000–50 000 сомов",50000],["50 000–150 000 сомов",150000],["Более 150 000 сомов",1e7]];
function opt(on,t,a,v,ic=""){return`<button class="opt ${on?"on":""}" data-a="${a}" data-v="${v}">${ic} ${t}</button>`}
function greenik(){const q=S.q,st=q.step;let b="",skip=[1,4,5].includes(st);
if(st==0)b=Object.entries(HOUS).map(([k,t])=>opt(q.housing==k,t,"housing",k)).join("");
if(st==1)b=Object.keys(REG).map(r=>opt(q.region==r,r,"region",r)).join("");
if(st==2)b=Object.entries(GOALS).map(([k,t])=>opt(q.goals.includes(k),t,"goal2",k)).join("");
if(st==3)b=BUD.map(([t,v])=>opt(q.budget==v&&!q.custom,t,"bud",v)).join("")+`<div class="opt" style="cursor:default"><label class="sm mu">Другой бюджет, сомов</label><input id="cb" type="number" min="0" value="${q.custom}" style="width:100%"><div class="err" id="ce"></div></div>`;
if(st==4)b=Object.entries(RES).map(([k,t])=>opt(q.res.includes(k),t,"res",k)).join("");
if(st==5)b=`<div class="opt" style="cursor:default"><label class="sm mu">Электричество, сомов/мес</label><input id="ce1" type="number" min="0" value="${q.elec}" style="width:100%"><div class="err" id="e1"></div></div><div class="opt" style="cursor:default"><label class="sm mu">Отопление, сомов/мес</label><input id="ce2" type="number" min="0" value="${q.heat}" style="width:100%"><div class="err" id="e2"></div></div><div class="opt" style="cursor:default"><label class="sm mu">Есть своя крыша или участок?</label><select id="roof" style="width:100%">${["","yes","no"].map(v=>`<option value="${v}" ${q.roof==v?"selected":""}>${{"":"Не указано",yes:"Да",no:"Нет"}[v]}</option>`).join("")}</select></div><div class="opt" style="cursor:default"><label class="sm mu">Можно устанавливать оборудование?</label><select id="inst" style="width:100%">${["","yes","no"].map(v=>`<option value="${v}" ${q.inst==v?"selected":""}>${{"":"Не указано",yes:"Да",no:"Нет, только простые решения"}[v]}</option>`).join("")}</select></div>`;
return`<section class="sec" style="max-width:780px;margin:auto"><div class="row"><div class="av">${LOGO.replace("currentColor","transparent")}</div><div><b>Найди своё решение с Greenik</b><div class="mu sm">Ответь на несколько вопросов — подберу решения под твой бюджет</div></div></div><div class="bar"><i style="width:${(st+1)/6*100}%"></i></div><h2>${QS[st]}</h2><div class="mu sm">Шаг ${st+1} из 6</div><div class="opts">${b}</div><div class="row">${st?`<button class="btn o" data-a="back">Назад</button>`:""}${skip?`<button class="btn o" data-a="skip">Пропустить</button>`:""}<button class="btn" data-a="next">${st==5?"Показать решения":"Далее"}</button></div><div class="err" id="se"></div></section>`}
function recommend(){const u=S.q,bud=u.custom?+u.custom:(u.budget||1e9),res=u.res.length&&!u.res.includes("unknown")?u.res:null;
let L=D.filter(i=>i.t.includes(u.housing||"house")&&(!u.goals.length||i.g.some(g=>u.goals.includes(g)))&&(!res||i.nd.every(n=>res.includes(n)))&&!(u.roof=="no"&&i.roof)&&!(u.inst=="no"&&i.in>0)&&cost(i)<=bud);
L=L.map(i=>({i,m:monthly(i,u)}));const w=L.filter(x=>x.m),mid=x=>(x.m.lo+x.m.hi)/2;const used=new Set(),pk=[];
const add=(lab,x)=>{if(x&&!used.has(x.i.id)){used.add(x.i.id);pk.push({lab,...x})}};
add("Самый доступный вариант",[...w].sort((a,b)=>cost(a.i)-cost(b.i))[0]);
add("Оптимальный вариант",[...w].filter(x=>!used.has(x.i.id)).sort((a,b)=>cost(a.i)/mid(a)-cost(b.i)/mid(b))[0]);
add("Максимальная потенциальная экономия",[...w].filter(x=>!used.has(x.i.id)).sort((a,b)=>mid(b)-mid(a))[0]);
S.res={pk,n:L.length,bud:u.custom?+u.custom:u.budget,alt:L.length?null:D.filter(i=>i.t.includes(u.housing||"house")&&(!u.goals.length||i.g.some(g=>u.goals.includes(g)))).sort((a,b)=>cost(a)-cost(b)).slice(0,2)}}
function why(x,u){const i=x.i,p=[];if(u.goals.length)p.push("соответствует цели «"+GOALS[i.g.find(g=>u.goals.includes(g))||i.g[0]].toLowerCase()+"»");p.push("стоит "+fm(cost(i))+(u.budget?" — в рамках бюджета":""));if(i.heat&&u.region&&REG[u.region]>1)p.push("в регионе «"+u.region+"» зима холоднее, потери тепла выше");return"Подходит: "+p.join("; ")+"."}
function results(){if(!S.res)recommend();const r=S.res,u=S.q;const lo=r.pk.reduce((s,x)=>s+x.m.lo,0),hi=r.pk.reduce((s,x)=>s+x.m.hi,0);
const st=(t,v)=>`<div class="card stat"><span class="mu sm">${t}</span><b>${v}</b></div>`;
let h=`<section class="sec"><h2>Твои персональные решения</h2><p class="mu">Мы подобрали решения для твоего дома. Экономия — расчётный сценарий, а не гарантия.</p><div class="grid g4">${st("Твой бюджет",r.bud&&r.bud<1e7?fm(r.bud):r.bud?"более 150 000 с":"не указан")}${st("Подходящих решений",r.n)}${st("Экономия в месяц",r.pk.length?fm(lo)+" – "+fm(hi):"—")}${st("Экономия в год",r.pk.length?fm(lo*12)+" – "+fm(hi*12):"—")}</div></section>`;
if(!r.pk.length)h+=`<section class="sec"><div class="card"><h3>В рамках бюджета ничего не найдено</h3><p class="mu">Попробуй увеличить бюджет, выбрать другую цель или разрешить установку оборудования.</p>${r.alt&&r.alt.length?`<p>Самые доступные варианты из каталога:</p><div class="grid">${r.alt.map(i=>card(i,u)).join("")}</div>`:""}</div></section>`;
else{h+=`<section class="sec"><div class="grid">${r.pk.map(x=>card(x.i,u,`<div class="pr"><span>Основание</span><b class="sm">${x.m.basis}</b></div><p class="sm" style="margin-top:10px"><b style="color:var(--g)">${x.lab}.</b> ${why(x,u)}</p><p class="sm mu">Ограничения: ${x.i.rq}</p>`)).join("")}</div></section>`;
const o=r.pk[1]||r.pk[0],mm=(o.m.lo+o.m.hi)/2,c=cost(o.i),mx=Math.max(c,mm*60);const pts=[0,1,2,3,4,5].map(y=>[40+y*60,170-(mm*12*y-c)/mx*130-0]);
const cmpTotal=r.pk.length;
h+=`<section class="sec"><h3>Накопленная экономия за 5 лет: ${o.i.n}</h3><div class="card"><svg viewBox="0 0 400 200" style="width:100%"><path d="M40 170H380M40 20V170" stroke="var(--bd)"/><polyline fill="none" stroke="var(--g)" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/><line x1="40" x2="380" y1="${170-0}" y2="170" stroke="var(--g2)" stroke-dasharray="4"/>${pts.map((p,y)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--g)"/><text x="${p[0]}" y="190" font-size="11" text-anchor="middle" fill="var(--mu)">${y} г.</text>`).join("")}</svg><p class="sm mu">Линия — средняя экономия минус первоначальные затраты (${fm(c)}). Когда линия поднимается выше оси, решение окупилось. Расчёт по среднему значению диапазона.</p></div></section>
<section class="sec"><h3>Расходы до и после (в месяц)</h3><div class="card">${[["Без изменений",1],["С решениями",0]].map(([t,b])=>{const base=Math.max(+u.elec||0,0)+Math.max(+u.heat||0,0),w=b?100:base>0?Math.max(8,(1-(lo+hi)/2/base)*100):0;return base>0?`<div class="sm">${t}${b?"":" ≈ "+fm(Math.max(base-(lo+hi)/2,0))}</div><div class="bar" style="height:14px;margin:4px 0 12px"><i style="width:${w}%"></i></div>`:""}).join("")||'<p class="sm mu">Укажи ежемесячные расходы на шаге 6 — и мы покажем сравнение до и после.</p>'}</div></section>
<div class="row"><button class="btn" data-a="cmpAll">Сравнить рекомендованные</button><button class="btn o" data-a="edit">Изменить ответы</button></div>`}
return h+(r.pk.length?"":`<div class="row"><button class="btn o" data-a="edit">Изменить ответы</button></div>`)}
function compare(){const L=S.cmp.map(id=>D.find(x=>x.id==id));if(L.length<2)return`<section class="sec"><div class="card" style="text-align:center"><h3>Выберите 2–3 устройства</h3><p class="mu">Добавьте их в сравнение в каталоге или в рекомендациях Greenik.</p><button class="btn" data-r="catalog">В каталог</button></div></section>`;
const u=S.q,M=L.map(i=>monthly(i,u));const rows=[["Общая стоимость",L.map(i=>fm(cost(i)))],["Установка",L.map(i=>i.in?fm(i.in):"своими руками / нет")],["Экономия / мес",M.map(sv)],["Экономия / год",M.map(m=>m?fm(m.lo*12)+" – "+fm(m.hi*12):"—")],["Окупаемость",L.map((i,k)=>payback(i,M[k]))],["Тип жилья",L.map(i=>i.t.map(x=>HOUS[x]).join(", "))],["Ресурсы",L.map(i=>i.nd.length?i.nd.map(x=>RES[x]).join(", "):"не требуются")],["Требования",L.map(i=>i.rq)],["Преимущества",L.map(i=>i.d)]];
return`<section class="sec"><h2>Сравнение</h2><p class="mu">Лучший вариант зависит от твоих целей и бюджета — таблица показывает различия, а не победителя.</p><div class="sc card"><table><tr><th></th>${L.map(i=>`<th>${i.i} ${i.n}<br><button class="btn s o" data-a="cmp" data-id="${i.id}">Убрать</button></th>`).join("")}</tr>${rows.map(([t,c])=>`<tr class="${new Set(c).size>1?"diff":""}"><th>${t}</th>${c.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div></section>`}
function how(){return`<section class="sec"><h2>Как это работает</h2><div class="grid g4">${[["🏠","Расскажи о жилье и бюджете","Ответь на несколько простых вопросов. Необязательные можно пропустить."],["✨","Получи рекомендации","Greenik отберёт доступные и подходящие решения и объяснит выбор."],["⚖️","Сравни и реши","Посмотри стоимость, экономию и окупаемость до того, как потратишь деньги."]].map(([i,t,d])=>`<div class="card"><div class="ico">${i}</div><h3>${t}</h3><p class="mu sm">${d}</p></div>`).join("")}</div></section>`+about(1)}
function about(n){return`<section class="sec">${n?"":"<h2>О проекте</h2>"}<div class="card"><h3>Greenik — помощник, а не просто каталог</h3><p class="mu">Это прототип для хакатона. Подбор работает на правилах и расчётах прямо в браузере; ИИ-модель не подключена, но логику можно перенести на защищённый backend. Формулы: годовая экономия = месячная × 12; окупаемость (мес.) = затраты / месячная экономия. Если данных мало, показываем диапазон или «Недостаточно данных». Все цены демонстрационные.</p></div></section>`}
function route(){const r=(location.hash||"#home").slice(1);nav(r);const A=$("#app");
const pages={home,catalog,greenik,how,about:()=>about(0),compare,results};
if(r=="catalog"){A.innerHTML=`<div class="grid sec">${'<div class="skel"></div>'.repeat(3)}</div>`;setTimeout(()=>{if((location.hash||"").slice(1)=="catalog"){A.innerHTML=catalog();catList()}},350);return}
A.innerHTML=(pages[r]||home)();window.scrollTo(0,0)}
function go(r){location.hash=r}
function refresh(){const r=(location.hash||"#home").slice(1);nav(r);if(r=="catalog")catList();else if(["compare","results","home"].includes(r))$("#app").innerHTML=(r=="compare"?compare:r=="results"?results:home)()}
function modal(i){const m=monthly(i,S.q);$("#md").innerHTML=`<div class="modal" data-a="close"><div class="card" onclick="event.stopPropagation()">${ico(i)}<h2>${i.n}</h2><div>${i.tg.map(t=>`<span class="tag">${t}</span>`).join("")}</div><p>${i.d}</p><div class="pr"><span>Категория</span><b>${CATS[i.c]}</b></div><div class="pr"><span>Цена устройства</span><b>${fm(i.p)}</b></div><div class="pr"><span>Установка</span><b>${i.in?fm(i.in):"не требуется"}</b></div><div class="pr"><span>Экономия / мес</span><b>${sv(m)}</b></div><div class="pr"><span>Окупаемость</span><b>${payback(i,m)}</b></div><div class="pr"><span>Ресурсы</span><b>${i.nd.length?i.nd.map(x=>RES[x]).join(", "):"не нужны"}</b></div><p class="sm" style="margin-top:12px"><b>Ограничения:</b> ${i.rq}</p><p class="sm mu">Источник: демонстрационные данные. ${m?m.basis:"Недостаточно данных для расчёта экономии."}</p><button class="btn" data-a="close">Закрыть</button></div></div>`}
function next(){const q=S.q,st=q.step,e=$("#se");e.textContent="";
if(st==0&&!q.housing)return e.textContent="Выбери тип жилья.";if(st==2&&!q.goals.length)return e.textContent="Выбери хотя бы одну цель.";
if(st==3){const c=$("#cb").value;if(c!==""){if(!(+c>0)){$("#ce").textContent="Введите сумму больше нуля.";return}q.custom=c}else q.custom="";if(!q.custom&&!q.budget)return e.textContent="Выбери бюджет или введи свою сумму."}
if(st==5){q.elec=$("#ce1").value;q.heat=$("#ce2").value;q.roof=$("#roof").value;q.inst=$("#inst").value;if(+q.elec<0||+q.heat<0){$("#e1").textContent="Сумма не может быть отрицательной.";return}}
if(st==5){S.res=null;go("results");return}q.step++;$("#app").innerHTML=greenik()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-r],[data-a]");if(!el)return;const d=el.dataset,q=S.q,tg=(s,v)=>{const k=s.indexOf(v);k<0?s.push(v):s.splice(k,1)};
if(d.r)return go(d.r);const a=d.a,id=+d.id;
if(a=="det")return modal(D.find(x=>x.id==id));if(a=="close"){$("#md").innerHTML="";return}
if(a=="fav"){S.fav.has(id)?S.fav.delete(id):S.fav.add(id);return refresh()}
if(a=="cmp"){const k=S.cmp.indexOf(id);if(k>=0)S.cmp.splice(k,1);else if(S.cmp.length<3)S.cmp.push(id);else alert("Можно сравнить до трёх устройств.");return refresh()}
if(a=="cmpAll"){S.cmp=S.res.pk.map(x=>x.i.id);return go("compare")}
if(a=="reset"){S.f={s:"",c:"",h:"",g:"",max:"",sort:"p"};return route()}
if(a=="goal"){S.f={s:"",c:"",h:"",g:d.g,max:"",sort:"p"};return go("catalog")}
if(a=="demo"){Object.assign(S.q,{step:0,housing:"apt",region:"Бишкек",goals:["elec","water","eff"],budget:10000,custom:"",res:[],elec:"1500",heat:"",roof:"",inst:""});S.res=null;return go("results")}
if(a=="edit"){q.step=0;return go("greenik")}
if(a=="next")return next();if(a=="back"){q.step--;return $("#app").innerHTML=greenik()}
if(a=="skip"){q.step++;if(q.step>5){S.res=null;return go("results")}return $("#app").innerHTML=greenik()}
if(a=="housing")q.housing=d.v;if(a=="region")q.region=d.v;if(a=="goal2")tg(q.goals,d.v);if(a=="res")tg(q.res,d.v);if(a=="bud"){q.budget=+d.v;q.custom=""}
$("#app").innerHTML=greenik()});
document.addEventListener("input",e=>{const t=e.target;if(t.id=="fs"){S.f.s=t.value;catList()}else if(t.dataset.f){S.f[t.dataset.f]=t.value;catList()}});
addEventListener("hashchange",route);route();
</script></body></html>
